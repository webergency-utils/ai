name: Fuzzing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  fuzz:
    name: Jazzer.js Fuzzing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fuzz stream parsers
        run: node scripts/run-fuzz.mjs fuzz_stream.cjs -- -runs=10000 -max_total_time=300

      - name: Fuzz schema / spend / vector
        run: node scripts/run-fuzz.mjs fuzz_ai.cjs -- -runs=10000 -max_total_time=300
