name: Storage Integration

on:
  push:
    branches: [ "main", "feat-*" ]
    paths:
      - 'src/storage/**'
      - 'tests/storage/**'
      - '.github/workflows/storage-integration.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/storage/**'
      - 'tests/storage/**'
      - '.github/workflows/storage-integration.yml'

permissions: read-all

jobs:
  integration:
    name: Storage backends
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
          POSTGRES_DB: ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai -d ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgres://ai:ai@localhost:5432/ai
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY_ID: minioadmin
      TEST_S3_SECRET_ACCESS_KEY: minioadmin
      TEST_S3_BUCKET: ai-test
      TEST_S3_REGION: us-east-1
      TEST_S3_FORCE_PATH_STYLE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install optional driver peers
        run: npm install --no-save pg ioredis

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              break
            fi
            sleep 1
          done
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            minio/mc mb -p local/ai-test

      - name: Build
        run: npm run build

      - name: Run storage tests
        run: npx vitest run tests/storage --reporter=verbose 2>&1 | tee storage-test.log

      - name: Require live backend suites
        run: |
          # Contract suites are skipped when drivers/env are unavailable.
          # Fail the job if Postgres, Redis, or S3 still report as skipped.
          if grep -E '^\s*(↓|✓|×).*[Pp]ostgres' storage-test.log | grep -q '↓'; then
            echo 'Postgres suites still skipped'
            exit 1
          fi
          if grep -E '^\s*(↓|✓|×).*[Rr]edis' storage-test.log | grep -q '↓'; then
            echo 'Redis suites still skipped'
            exit 1
          fi
          if grep -E '^\s*(↓|✓|×).*[Ss]3' storage-test.log | grep -q '↓'; then
            echo 'S3 suites still skipped'
            exit 1
          fi
          echo 'Live backend suites executed'
